syntax = "proto3";

package blockchain;

option go_package = "blockchain-lab01/src/proto";

// Transport bytes only. Protocol types/validation remain in ordinary Go code.
// Signatures use canonical TRANSPORT bytes, never arbitrary protobuf encoding.
message Envelope {
    string chain_id = 1;
    uint32 sender = 2;
    uint32 recipient = 3;
    uint64 sequence = 4;
    string kind = 5;
    bytes reference = 6;
    uint64 height = 7;
    uint64 round = 8;
    bytes payload = 9;
    bytes signature = 10;
}
service Transport {
    // A long-lived authenticated peer session; requests, bodies and directed
    // protocol messages can flow independently in both directions.
    rpc Exchange(stream Envelope) returns (stream Envelope);
}
